<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Athenaeum Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo"><i class="fas fa-graduation-cap"></i></div>
        <h1>Athenaeum Admin</h1>
        <p class="sub">{{ admin_email }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}"><span>{{ message }}</span></div>
            {% endfor %}
          </div>
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <input type="hidden" name="email" value="{{ admin_email }}">
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-right-to-bracket"></i> Sign in
            </button>
        </form>
    </div>
</div>
</body>
</html>
